name: Engineering Factory - Quality Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/factory_doctor.py
      - run: python scripts/run_quality.py --allow-empty
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence
          path: reports/
          if-no-files-found: ignore
