name: Verify Next.js update
on:
  push:
    branches: [codex/verify-nightly-nextjs-audit]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Generate lockfile
        run: npm install --package-lock-only --no-fund --no-audit
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-update-lockfile
          path: package-lock.json
          if-no-files-found: error
      - run: npm ci --no-fund --no-audit
      - run: npm ls next eslint-config-next
      - run: python scripts/run_quality.py
      - if: always()
        run: git diff -- next-env.d.ts tsconfig.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-update-quality
          path: reports/quality.json
