name: Engineering Factory - Nightly Bug Hunt
on:
  schedule:
    - cron: '0 17 * * *' # 02:00 JST
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nightly-bug-hunt
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select target
        id: target
        shell: bash
        run: |
          J="$(python scripts/select_random_source.py --json)"
          TARGET="$(python -c 'import json,sys; print(json.load(sys.stdin)["path"])' <<<"$J")"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
      - name: No source yet
        if: steps.target.outputs.path == ''
        run: echo 'No source files yet; nightly bug hunt skipped.'
      - name: Create isolated branch
        if: steps.target.outputs.path != ''
        shell: bash
        run: |
          BRANCH="autofix/nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - if: steps.target.outputs.path != ''
        run: python scripts/run_quality.py --allow-empty
      - name: Autofix adapter
        if: steps.target.outputs.path != ''
        env:
          AUTOFIX_COMMAND: ${{ vars.AUTOFIX_COMMAND }}
        run: python scripts/autofix_adapter.py --target "${{ steps.target.outputs.path }}"
      - if: steps.target.outputs.path != ''
        run: python scripts/run_quality.py --allow-empty
      - name: Detect patch
        if: steps.target.outputs.path != ''
        id: patch
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Commit and push
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'engineering-factory[bot]'
          git config user.email 'engineering-factory[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix: nightly bug hunt for ${{ steps.target.outputs.path }}"
          git push origin "$BRANCH"
      - name: Draft PR
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/generate_pr_body.py --target "${{ steps.target.outputs.path }}" > /tmp/pr.md
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "fix: nightly bug hunt - ${{ steps.target.outputs.path }}" --body-file /tmp/pr.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bug-hunt-evidence
          path: reports/
          if-no-files-found: ignore
